services:
  api:
    build: .
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
  db:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gaas
      POSTGRES_PASSWORD: gaas
      POSTGRES_DB: gaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  worker:
    build: .
    env_file: ../.env
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    depends_on:
      - api
      - redis
volumes:
  pgdata:
